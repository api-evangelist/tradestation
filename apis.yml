aid: tradestation
name: TradeStation
description: >-
  TradeStation is a financial brokerage and trading platform offering a collection of RESTful brokerage and market data
  services for building trading applications for stocks, options, futures, and cryptocurrency. The API provides
  endpoints for account management, order placement and execution, real-time and historical market data, option chains,
  symbol information, and HTTP streaming for live market feeds. TradeStation supports advanced order types including
  bracket, OCO, OSO, and multi-leg options orders with OAuth2 authentication.
