apis:
  - aid: tradestation:tradestation-api
    name: TradeStation API
    tags:
      - Trading
      - Brokerage
      - Market Data
      - Stocks
      - Options
      - Futures
      - Streaming
      - Financial Services
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://api.tradestation.com
    humanURL: https://api.tradestation.com/docs/
    properties:
      - url: https://api.tradestation.com/docs/
        type: Documentation
      - url: https://api.tradestation.com/docs/specification/
        type: OpenAPI
      - url: openapi/tradestation-api-openapi.yml
        type: OpenAPI
      - url: asyncapi/tradestation-streaming-asyncapi.yml
        type: AsyncAPI
      - url: json-schema/tradestation-order-schema.json
        type: JSONSchema
    description: >-
      The TradeStation API is a collection of RESTful brokerage and market data
      services used to build trading applications for stocks, options, and futures.
      The API provides endpoints for account management, order placement and
      execution, real-time and historical market data, and HTTP streaming for
      quotes, positions, and order updates. TradeStation supports advanced order
      types including bracket, OCO, OSO, and multi-leg options orders, with both
      intelligent and direct order routing. The API uses OAuth2 authentication and
      is available in version 3, which is the recommended version for new
      integrations. TradeStation Securities recently announced a strategic API
      integration with Level2, a visual strategy-automation platform by Bytemine
      Technologies, which leverages the TradeStation API to connect Level2s
      drag-and-drop interface directly to user accounts, allowing traders to build,
      backtest, and deploy complex rule-based strategies without writing code.
