naftiko: "1.0.0-alpha1"

info:
  label: "TradeStation API"
  description: "RESTful brokerage and market data services for stocks, options, futures, and cryptocurrency trading. Provides account management, order execution, real-time market data, option chains, and symbol information."
  tags:
    - Accounts
    - Brokerage
    - Cryptocurrency
    - Finance
    - Market Data
    - Options
    - Order Execution
    - Trading
  created: "2026-05-03"
  modified: "2026-05-03"

binds:
  - namespace: env
    keys:
      TRADESTATION_ACCESS_TOKEN: TRADESTATION_ACCESS_TOKEN

capability:
  consumes:
    - type: http
      namespace: tradestation-api
      baseUri: https://api.tradestation.com
      description: "TradeStation REST API for brokerage and market data"
      authentication:
        type: bearer
        token: "{{TRADESTATION_ACCESS_TOKEN}}"
      resources:
        - name: accounts
          path: /v3/brokerage/accounts
          description: "Brokerage account management"
          operations:
            - name: get-accounts
              method: GET
              description: "Retrieve all brokerage accounts"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-balances
              method: GET
              description: "Retrieve account balances"
              inputParameters:
                - name: accountIds
                  in: path
                  type: string
                  required: true
                  description: "Comma-separated account identifiers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-balances-bod
              method: GET
              description: "Retrieve beginning-of-day account balances"
              inputParameters:
                - name: accountIds
                  in: path
                  type: string
                  required: true
                  description: "Comma-separated account identifiers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-positions
              method: GET
              description: "Retrieve account positions"
              inputParameters:
                - name: accountIds
                  in: path
                  type: string
                  required: true
                  description: "Comma-separated account identifiers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-orders
              method: GET
              description: "Retrieve active account orders"
              inputParameters:
                - name: accountIds
                  in: path
                  type: string
                  required: true
                  description: "Comma-separated account identifiers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-historical-orders
              method: GET
              description: "Retrieve historical orders"
              inputParameters:
                - name: accountIds
                  in: path
                  type: string
                  required: true
                  description: "Comma-separated account identifiers"
                - name: since
                  in: query
                  type: string
                  required: false
                  description: "Filter since date (MM-DD-YYYY)"
                - name: pageSize
                  in: query
                  type: integer
                  required: false
                  description: "Number of orders per page"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-wallets
              method: GET
              description: "Retrieve cryptocurrency wallets"
              inputParameters:
                - name: accountId
                  in: path
                  type: string
                  required: true
                  description: "Account identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: market-data
          path: /v3/marketdata
          description: "Real-time and historical market data"
          operations:
            - name: get-quotes
              method: GET
              description: "Retrieve real-time quote snapshots"
              inputParameters:
                - name: symbols
                  in: path
                  type: string
                  required: true
                  description: "Comma-separated symbol identifiers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-bars
              method: GET
              description: "Retrieve historical bar chart data (OHLC)"
              inputParameters:
                - name: symbol
                  in: path
                  type: string
                  required: true
                  description: "Symbol to retrieve bars for"
                - name: interval
                  in: query
                  type: integer
                  required: false
                  description: "Bar interval"
                - name: unit
                  in: query
                  type: string
                  required: false
                  description: "Time unit (Minute, Daily, Weekly, Monthly)"
                - name: barsBack
                  in: query
                  type: integer
                  required: false
                  description: "Number of bars going back"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-symbols
              method: GET
              description: "Retrieve detailed symbol information"
              inputParameters:
                - name: symbols
                  in: path
                  type: string
                  required: true
                  description: "Comma-separated symbol identifiers"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-crypto-pairs
              method: GET
              description: "Retrieve cryptocurrency trading pairs"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: options
          path: /v3/marketdata/options
          description: "Options market data"
          operations:
            - name: get-option-expirations
              method: GET
              description: "Retrieve option expiration dates"
              inputParameters:
                - name: underlying
                  in: path
                  type: string
                  required: true
                  description: "Underlying symbol"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-option-strikes
              method: GET
              description: "Retrieve option strike prices"
              inputParameters:
                - name: underlying
                  in: path
                  type: string
                  required: true
                  description: "Underlying symbol"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-option-spread-types
              method: GET
              description: "Retrieve option spread types"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: calculate-option-risk-reward
              method: POST
              description: "Calculate option risk/reward profile"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  SpreadPrice: "{{tools.spread_price}}"
                  Legs: "{{tools.legs}}"
        - name: order-execution
          path: /v3/orderexecution
          description: "Order placement and management"
          operations:
            - name: place-order
              method: POST
              description: "Place a new order"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  AccountID: "{{tools.account_id}}"
                  Symbol: "{{tools.symbol}}"
                  Quantity: "{{tools.quantity}}"
                  OrderType: "{{tools.order_type}}"
                  TradeAction: "{{tools.trade_action}}"
                  TimeInForce: "{{tools.time_in_force}}"
                  LimitPrice: "{{tools.limit_price}}"
            - name: confirm-order
              method: POST
              description: "Preview order costs before placement"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  AccountID: "{{tools.account_id}}"
                  Symbol: "{{tools.symbol}}"
                  Quantity: "{{tools.quantity}}"
                  OrderType: "{{tools.order_type}}"
                  TradeAction: "{{tools.trade_action}}"
                  TimeInForce: "{{tools.time_in_force}}"
            - name: replace-order
              method: PUT
              description: "Modify an existing order"
              inputParameters:
                - name: orderId
                  in: path
                  type: string
                  required: true
                  description: "Order identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Quantity: "{{tools.quantity}}"
                  LimitPrice: "{{tools.limit_price}}"
            - name: cancel-order
              method: DELETE
              description: "Cancel an existing order"
              inputParameters:
                - name: orderId
                  in: path
                  type: string
                  required: true
                  description: "Order identifier"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: place-order-group
              method: POST
              description: "Place a group order (OCO, bracket, OSO)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  Type: "{{tools.group_type}}"
                  Orders: "{{tools.orders}}"
        - name: reference-data
          path: /v3/orderexecution
          description: "Order execution reference data"
          operations:
            - name: get-activation-triggers
              method: GET
              description: "Retrieve activation trigger methods"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: get-routes
              method: GET
              description: "Retrieve order routing destinations"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: tradestation-rest-api
      resources:
        - path: /v1/accounts
          name: accounts
          description: "Brokerage accounts"
          operations:
            - method: GET
              name: get-accounts
              description: "Retrieve brokerage accounts"
              call: "tradestation-api.get-accounts"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: tradestation-mcp
      transport: http
      tools:
        - name: get-accounts
          description: "Retrieve TradeStation brokerage accounts"
          hints:
            readOnly: true
            openWorld: false
          call: "tradestation-api.get-accounts"
          outputParameters:
            - type: object
              mapping: "$."
