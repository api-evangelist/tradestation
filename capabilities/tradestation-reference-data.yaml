naftiko: 1.0.0-alpha2
info:
  label: TradeStation API — Reference Data
  description: 'TradeStation API — Reference Data. 2 operations. Lead operation: Get activation triggers. Self-contained Naftiko
    capability covering one Tradestation business surface.'
  tags:
  - Tradestation
  - Reference Data
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRADESTATION_API_KEY: TRADESTATION_API_KEY
capability:
  consumes:
  - type: http
    namespace: tradestation-reference-data
    baseUri: https://api.tradestation.com
    description: TradeStation API — Reference Data business capability. Self-contained, no shared references.
    resources:
    - name: v3-orderexecution-activationtriggers
      path: /v3/orderexecution/activationtriggers
      operations:
      - name: getactivationtriggers
        method: GET
        description: Get activation triggers
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v3-orderexecution-routes
      path: /v3/orderexecution/routes
      operations:
      - name: getroutes
        method: GET
        description: Get execution routes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.TRADESTATION_API_KEY}}'
  exposes:
  - type: rest
    namespace: tradestation-reference-data-rest
    port: 8080
    description: REST adapter for TradeStation API — Reference Data. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v3/orderexecution/activationtriggers
      name: v3-orderexecution-activationtriggers
      description: REST surface for v3-orderexecution-activationtriggers.
      operations:
      - method: GET
        name: getactivationtriggers
        description: Get activation triggers
        call: tradestation-reference-data.getactivationtriggers
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/v3/orderexecution/routes
      name: v3-orderexecution-routes
      description: REST surface for v3-orderexecution-routes.
      operations:
      - method: GET
        name: getroutes
        description: Get execution routes
        call: tradestation-reference-data.getroutes
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: tradestation-reference-data-mcp
    port: 9090
    transport: http
    description: MCP adapter for TradeStation API — Reference Data. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-activation-triggers
      description: Get activation triggers
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tradestation-reference-data.getactivationtriggers
      outputParameters:
      - type: object
        mapping: $.
    - name: get-execution-routes
      description: Get execution routes
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: tradestation-reference-data.getroutes
      outputParameters:
      - type: object
        mapping: $.
